<!-- @dsCard group="Primitives" height=330 subtitle="Label with (i), input, hint, error" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>body{margin:0;background:var(--background)}</style>
</head><body>
<div class="fb" style="padding:24px; display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:24px">
  <div class="fb-field">
    <div class="fb-field__labelrow">
      <label class="fb-field__label" for="rank">Your country rank</label>
      <button class="fb-info" aria-label="Where to find your country rank"><span aria-hidden="true">i</span></button>
    </div>
    <input id="rank" class="fb-input fb-input--num" inputmode="numeric" placeholder="e.g. 52,310">
    <span class="fb-field__hint">Enter the rank the FPL app shows right now.</span>
  </div>
  <div class="fb-field fb-field--error">
    <div class="fb-field__labelrow">
      <label class="fb-field__label" for="link">Team link or ID</label>
      <button class="fb-info" aria-label="Where to find your FPL link"><span aria-hidden="true">i</span></button>
    </div>
    <input id="link" class="fb-input" value="fantasy.premierleague.com/leagues" aria-invalid="true" aria-describedby="link-err">
    <span id="link-err" class="fb-field__error">That link has no team ID in it. Look for /entry/ followed by a number.</span>
  </div>
  <div class="fb-field">
    <label class="fb-field__label" for="country">Country</label>
    <select id="country" class="fb-select"><option>United States</option><option>England</option></select>
    <span class="fb-field__hint">Picked from your device. Change it if it's wrong.</span>
  </div>
</div>
</body></html>
