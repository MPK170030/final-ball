<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>body{margin:0;background:var(--scrim)}</style>
</head><body>
<div class="fb" style="padding:0 0 0 50px; max-width:390px">
  <section class="fb-guide" role="dialog" aria-label="Where's my country rank?" style="min-height:620px">
    <div class="fb-sheet__head" style="padding:16px 8px 8px 20px">
      <div style="display:flex;flex-direction:column;gap:2px;padding-top:8px"><span class="fb-label">In the FPL app</span><span style="font-size:20px;line-height:26px;font-weight:600">Where's my country rank?</span></div>
      <button class="fb-close" aria-label="Close"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M3 3 L15 15 M15 3 L3 15"/></svg></button>
    </div>
    <ol class="fb-stack" style="list-style:none;margin:0;padding:12px 20px 0;gap:16px">
      <li class="fb-guide__step"><div class="fb-phone" aria-hidden="true"><span class="fb-phone__bar"></span><span class="fb-phone__bar"></span><span class="fb-phone__bar"></span><div class="fb-phone__nav"><span></span><span></span><span class="hit"></span><span></span></div></div><div style="display:flex;flex-direction:column;gap:2px"><span class="fb-num fb-meta">Step 1</span><span>Open the FPL app and tap <b>Leagues</b>.</span></div></li>
      <li class="fb-guide__step"><div class="fb-phone" aria-hidden="true"><span class="fb-phone__bar"></span><span class="fb-phone__bar"></span><span class="fb-phone__bar fb-phone__bar--hit"></span><span class="fb-phone__bar"></span><span class="fb-phone__bar"></span></div><div style="display:flex;flex-direction:column;gap:2px"><span class="fb-num fb-meta">Step 2</span><span>Find your <b>country's name</b> in the list of leagues.</span></div></li>
      <li class="fb-guide__step"><div class="fb-phone" aria-hidden="true" style="justify-content:center"><span class="fb-phone__bar fb-phone__bar--hit" style="height:28px"></span></div><div style="display:flex;flex-direction:column;gap:2px"><span class="fb-num fb-meta">Step 3</span><span>Your rank is the <b>number next to it</b>. Enter it as shown right now.</span></div></li>
    </ol>
    <div style="margin-top:auto;padding:16px 20px 24px"><button class="fb-btn fb-btn--primary fb-btn--block">Got it</button></div>
  </section>
</div>
</body></html>
